name: Feature idea
description: Suggest something DuelElo could do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are also very welcome in #ideas on [Discord](https://discord.gg/8Jyz7g4p64), where other players can weigh in.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and what would it help you do?
    validations:
      required: true
